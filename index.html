<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi personita favorita, Yessi ✨</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Quicksand -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 35%, #e8dff5 70%, #fcf6bd 100%);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .font-cute {
      font-family: 'Fredoka', cursive;
    }

    /* Floating background hearts/stars */
    @keyframes floatParticle {
      0% {
        transform: translateY(105vh) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.1) rotate(360deg);
        opacity: 0;
      }
    }
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: floatParticle linear infinite;
    }

    /* Card Glow */
    .card-glow {
      box-shadow: 0 20px 50px -10px rgba(255, 117, 143, 0.35),
                  0 0 30px 2px rgba(255, 209, 220, 0.5);
    }

    /* Character idle bobbing */
    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes gentleBobRight {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(-1.5deg); }
    }
    .bob-left {
      animation: gentleBob 3s ease-in-out infinite;
    }
    .bob-right {
      animation: gentleBobRight 3.2s ease-in-out infinite;
    }

    /* Thread pulse effect */
    @keyframes threadGlow {
      0%, 100% {
        filter: drop-shadow(0 0 3px #ff2a5f) drop-shadow(0 0 8px rgba(255, 42, 95, 0.6));
        stroke: #ff1e56;
      }
      50% {
        filter: drop-shadow(0 0 6px #ff758f) drop-shadow(0 0 14px rgba(255, 117, 143, 0.8));
        stroke: #ff4d6d;
      }
    }
    .glowing-thread {
      animation: threadGlow 2.5s ease-in-out infinite;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Cheek kiss prank cartoon animations */
    @keyframes popBoop {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; }
      60% { transform: scale(1.3) rotate(15deg); opacity: 1; }
      80% { transform: scale(0.9) rotate(-8deg); }
      100% { transform: scale(1.1) rotate(0deg); opacity: 1; }
    }
    .animate-boop-pop {
      animation: popBoop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes dizzySpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spin-dizzy {
      animation: dizzySpin 2s linear infinite;
    }

    @keyframes wobbleSurprise {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg) scale(1.05); }
      40% { transform: rotate(10deg) scale(1.05); }
      60% { transform: rotate(-6deg); }
      80% { transform: rotate(6deg); }
    }
    .wobble-surprised {
      animation: wobbleSurprise 0.6s ease-in-out;
    }

    /* Heart pulse effect */
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .pulse-heart {
      animation: heartbeat 1.2s ease-in-out infinite;
    }
  </style>
</head>

                <!-- Right Eye -->

              <ellipse cx="32" cy="54" rx="5" ry="3.5" fill="#ff8fa3" opacity="0.8" />

      <button onclick="resetScene()" class="flex items-center gap-1.5 text-gray-500 hover:text-pink-600 font-semibold py-1.5 px-3 rounded-lg hover:bg-pink-50 transition-colors">

    </div>

  </main>

  <!-- Sweet Little Floating Audio Synthesis (Web Audio API - No external files needed!) -->
  <script>
    // Audio synthesizer for cute SFX
    const AudioFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playHugChime() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
            gain.gain.setValueAtTime(0.001, this.ctx.currentTime + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.18, this.ctx.currentTime + idx * 0.1 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + idx * 0.1 + 0.6);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.1);
            osc.stop(this.ctx.currentTime + idx * 0.1 + 0.65);
          });
        } catch (e) {
          // Audio blocked by browser policy until gesture
        }
      },
      playSqueakBoop() {
        try {
          this.init();
          if (!this.ctx) return;
          // Rubber duck squeak / slide whistle sound
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.12);
          osc.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.32);

          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.36);
        } catch(e) {}
      },
      playPop() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.linearRam
